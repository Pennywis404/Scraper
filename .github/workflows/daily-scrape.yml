name: Daily Scrape

on:
  # Exécution automatique tous les jours à 8h UTC (9h Paris hiver, 10h été)
  schedule:
    - cron: '0 8 * * *'

  # Permet aussi de lancer manuellement depuis GitHub
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of products to scrape'
        required: false
        default: '50'
      source:
        description: 'Source to scrape'
        required: false
        default: 'ph'
        type: choice
        options:
          - ph
          - ih
          - all

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Create Google credentials file
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > credentials/google_sheets.json

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_PATH: credentials/google_sheets.json
          API_BASE_URL: https://api.producthunt.com/v2/api/graphql
          RATE_LIMIT_DELAY: 1
        run: |
          python main.py --scrape \
            --limit ${{ github.event.inputs.limit || 50 }} \
            --source ${{ github.event.inputs.source || 'ph' }}

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Daily scrape completed! ($(date '+%Y-%m-%d'))"
          else
            MESSAGE="❌ Daily scrape failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}"
